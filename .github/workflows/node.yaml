name: Node CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
      - name: Install locked dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Check source
        run: |
          yarn format:check
          yarn lint
          yarn typecheck
          yarn test
      - name: Build and exercise packaged module
        run: |
          yarn package
          yarn check
          mkdir -p package-check
          tar -xzf ./*.tgz -C package-check
          yarn test:package package-check/carousel-signage/main.js
          yarn test:emergency-package package-check/carousel-signage/main.js
